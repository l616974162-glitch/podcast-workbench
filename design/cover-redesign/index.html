<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节目封面扩展 · 三种新版布局</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6fb;color:#332c47;font:14px/1.7 'Microsoft YaHei',sans-serif}header{padding:19px 25px;background:white;border-bottom:1px solid #e4deee;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;font-weight:500;margin:0}p{font-size:12px;color:#706780;margin:5px 0}nav{display:flex;gap:12px;margin:16px 23px}nav button{flex:1;text-align:left;border:1px solid #e4deee;border-radius:8px;background:white;padding:13px 15px;color:#332c47;cursor:pointer;font:inherit}nav button strong{display:block;font-size:13px}nav button span{font-size:11px;color:#706780}nav button[aria-pressed=true]{border-color:#7052a3;background:#eee8f8}.frame{margin:0 23px;border:1px solid #e4deee;border-radius:10px;background:white;overflow:auto}iframe{width:100%;min-width:800px;height:1200px;display:block;border:0}a{font-size:12px;color:#7052a3}#pick{background:#7052a3;color:white;border:0;border-radius:6px;padding:10px 15px;cursor:pointer;white-space:nowrap}#message{margin:14px 25px 23px}button:focus-visible,a:focus-visible{outline:2px solid #7052a3;outline-offset:3px}.explain{margin:0 25px 14px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}nav{gap:6px;margin:12px}nav button{padding:10px}.frame{margin:0 12px}}</style></head><body><header><div><h1>为播客工作台加入节目封面</h1><p>大材料区与紧凑角色行保留；选择你喜欢的节目制作布局。</p></div><button id="pick" type="button">记录选择 A</button></header><nav aria-label="切换预览布局"><button type="button" data-choice="a" aria-pressed="true"><strong>A · 同屏制作（推荐）</strong><span>延续浅紫色，右侧增加封面页签</span></button><button type="button" data-choice="b" aria-pressed="false"><strong>B · 分步制作</strong><span>材料 → 脚本 → 音频与封面</span></button><button type="button" data-choice="c" aria-pressed="false"><strong>C · 成品优先</strong><span>封面和播放器居上，材料与设置居下</span></button></nav><p class="explain">点击“封面”页签或步骤切换体验布局。示意图不是模型生成结果，当前不调用 API。 <a id="direct" href="a.html" target="_blank" rel="noopener">单独打开 A</a></p><div class="frame"><iframe id="preview" src="a.html" title="A 同屏制作预览"></iframe></div><p id="message" role="status">看完后在聊天里回复 A、B 或 C，也可以继续提修改意见。</p><script>let selected='a';document.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{selected=button.dataset.choice;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#preview').src=selected+'.html';document.querySelector('#preview').title=button.querySelector('strong').textContent;document.querySelector('#pick').textContent='记录选择 '+selected.toUpperCase();document.querySelector('#direct').href=selected+'.html';document.querySelector('#direct').textContent='单独打开 '+selected.toUpperCase()});document.querySelector('#pick').onclick=()=>{try{localStorage.setItem('cover-layout-selection',selected)}catch{}document.querySelector('#message').textContent='已记录 '+selected.toUpperCase()+'，请在聊天中确认后再接入正式页面。'};</script></body></html>
